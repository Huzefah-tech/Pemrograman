<!DOCTYPE html>
<html>
  <head>
    <title>Bootstrap Carousel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
      .carousel-inner > .item > img,
      .carousel-inner > .item > a > img {
        width: 80%;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Contoh Carousel</h2>
      <div id="myCarousel" class="carousel slide" data-ride="carousel">
        <!-- Indicators -->
        <ol class="carousel-indicators">
          <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
          <li data-target="#myCarousel" data-slide-to="1"></li>
          <li data-target="#myCarousel" data-slide-to="2"></li>
          <li data-target="#myCarousel" data-slide-to="3"></li>
        </ol>

        <!-- Wrapper for slides -->
        <div class="carousel-inner" role="listbox">
          <div class="item active">
            <img src="Picture1.png" alt="Gambar 1" width="460" height="345" />
            <div class="carousel-caption">
              <h3>Slide 1</h3>
              <p>Ini adalah slide pertama.</p>
            </div>
          </div>

          <div class="item">
            <img src="Picture2.png" alt="Gambar 2" width="460" height="345" />
            <div class="carousel-caption">
              <h3>Slide 2</h3>
              <p>Ini adalah slide kedua.</p>
            </div>
          </div>

          <div class="item">
            <img src="Picture3.png" alt="Gambar 3" width="460" height="345" />
            <div class="carousel-caption">
              <h3>Slide 3</h3>
              <p>Ini adalah slide ketiga.</p>
            </div>
          </div>

          <div class="item">
            <img src="Picture4.png" alt="Gambar 4" width="460" height="345" />
            <div class="carousel-caption">
              <h3>Slide 4</h3>
              <p>Ini adalah slide keempat.</p>
            </div>
          </div>
        </div>

        <!-- Left and right controls -->
        <a
          class="left carousel-control"
          href="#myCarousel"
          role="button"
          data-slide="prev"
        >
          <span
            class="glyphicon glyphicon-chevron-left"
            aria-hidden="true"
          ></span>
          <span class="sr-only">Previous</span>
        </a>
        <a
          class="right carousel-control"
          href="#myCarousel"
          role="button"
          data-slide="next"
        >
          <span
            class="glyphicon glyphicon-chevron-right"
            aria-hidden="true"
          ></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>
  </body>
</html>
