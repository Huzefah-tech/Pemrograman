<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Biodata Horizontal</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h2>Form Biodata (Horizontal)</h2>

      <form class="form-horizontal" action="proses-biodata.php" method="post">
        <div class="form-group">
          <label class="control-label col-sm-2" for="nama">Nama Lengkap</label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              id="nama"
              name="nama"
              placeholder="Nama Lengkap"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="tempat_lahir"
            >Tempat Lahir</label
          >
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              id="tempat_lahir"
              name="tempat_lahir"
              placeholder="Tempat Lahir"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="tanggal_lahir"
            >Tanggal Lahir</label
          >
          <div class="col-sm-10">
            <input
              type="date"
              class="form-control"
              id="tanggal_lahir"
              name="tanggal_lahir"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="alamat">Alamat</label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              id="alamat"
              name="alamat"
              placeholder="Alamat"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="telepon">Telepon</label>
          <div class="col-sm-10">
            <input
              type="tel"
              class="form-control"
              id="telepon"
              name="telepon"
              placeholder="No. Telepon"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="email">Email</label>
          <div class="col-sm-10">
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="pendidikan"
            >Pendidikan</label
          >
          <div class="col-sm-10">
            <select
              class="form-control"
              id="pendidikan"
              name="pendidikan"
              required
            >
              <option value="">Pilih Pendidikan</option>
              <option value="SMA">SMA/SMK</option>
              <option value="D3">Diploma (D3)</option>
              <option value="S1">Sarjana (S1)</option>
              <option value="S2">Magister (S2)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="pekerjaan"
            >Pekerjaan</label
          >
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              id="pekerjaan"
              name="pekerjaan"
              placeholder="Pekerjaan"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2" for="hobi">Hobi</label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control"
              id="hobi"
              name="hobi"
              placeholder="Hobi"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="control-label col-sm-2">Jenis Kelamin</label>
          <div class="col-sm-10">
            <label class="radio-inline">
              <input
                type="radio"
                name="jenis_kelamin"
                value="Laki-laki"
                required
              />
              Laki-laki
            </label>
            <label class="radio-inline">
              <input
                type="radio"
                name="jenis_kelamin"
                value="Perempuan"
                required
              />
              Perempuan
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Kirim</button>
      </form>
    </div>
  </body>
</html>
