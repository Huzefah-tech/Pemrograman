<!DOCTYPE html>
<html>
  <head>
    <title>Bootstrap Collapse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Contoh Collapsible</h2>
      <button
        type="button"
        class="btn btn-info"
        data-toggle="collapse"
        data-target="#demo"
      >
        Tampilkan Narasi
      </button>
      <div id="demo" class="collapse">
        <p>
          "Proklamasi. Kami, bangsa Indonesia dengan ini menjatakan kemerdekaan
          Indonesia.
        </p>
        <p>Hal-hal jang mengenai pemindahan kekoeasaan d.l.l.,</p>
        <p>
          diselenggarakan dengan tjara saksama dan dalam tempo jang
          sesingkat-singkatnja.
        </p>
        <p>Djakarta, 17-Agustus-1945"</p>
      </div>
    </div>
  </body>
</html>
