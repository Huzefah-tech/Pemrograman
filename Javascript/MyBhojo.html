<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Istriku🤍</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: #1b0b2e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Poppins", sans-serif;
      }

      .slideshow {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        opacity: 0;
        animation: fade 18s infinite;
        transition: opacity 2s ease;
      }

      .slide:nth-child(1) {
        background-image: url("alisa1.png");
        animation-delay: 0s;
      }

      .slide:nth-child(2) {
        background-image: url("alisa2.png");
        animation-delay: 6s;
      }

      .slide:nth-child(3) {
        background-image: url("alisa3.png");
        animation-delay: 12s;
      }

      @keyframes fade {
        0%,
        33.33%,
        100% {
          opacity: 0;
        }
        8%,
        28% {
          opacity: 1;
        }
      }

      .text {
        position: absolute;
        top: 50%;
        left: 49%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 3em;
        font-weight: bold;
        text-shadow: 0 0 20px #c99bff;
        z-index: 2;
        animation: textfade 18s infinite;
      }

      @keyframes textfade {
        0%,
        20%,
        100% {
          opacity: 0;
        }
        5%,
        15% {
          opacity: 1;
        }
      }

      /* Efek transisi lembut saat tampil */
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(27, 11, 46, 0.3);
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="slideshow">
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
    </div>
    <div class="overlay"></div>

    <div class="text">🤍Happy Birthday Istriku🤍</div>

    <audio id="music" loop>
      <source src="sekaiwakoiniochiteiru.mp3" type="audio/mpeg" />
    </audio>
    <script>
      // 🎵 Musik autoplay dengan klik pertama
      const music = document.getElementById("music");
      document.body.addEventListener(
        "click",
        () => {
          music.volume = 0;
          music.play();
          let fade = setInterval(() => {
            if (music.volume < 0.8) music.volume += 0.02;
            else clearInterval(fade);
          }, 100);
          document.getElementById("hint").style.display = "none";
        },
        { once: true }
      );
    </script>
  </body>
</html>
